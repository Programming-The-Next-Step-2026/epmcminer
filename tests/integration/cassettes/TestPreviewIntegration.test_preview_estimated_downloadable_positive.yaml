        Y, Chen G.\",\"authorList\":{\"author\":[{\"fullName\":\"Gong C\",\"firstName\":\"Chaoming\",\"lastName\":\"Gong\",\"initials\":\"C\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Xu
