        management and healthcare policy\",\"medlineAbbreviation\":\"Risk Manag Healthc
        Policy\",\"essn\":\"1179-1594\",\"issn\":\"1179-1594\",\"isoabbreviation\":\"Risk
        Manag Healthc Policy\",\"nlmid\":\"101566264\"}},\"pubYear\":\"2024\",\"pageInfo\":\"3315-3325\",\"abstractText\":\"<h4>Objective</h4>Depression
        is a potential health killer. As an important means of preventing various
        human diseases, physical exercise plays an important role in reducing the
        risk of depression. Using data from the Chinese Household Tracking Survey,
        this study analyzed the mechanisms by which physical exercise, self-rated
        health and life satisfaction reduce the risk of depression.<h4>Methods</h4>The
        data for this study comes from the China Family Panel Studies (CFPS) released
        by the China Social Science Survey Centre of Peking University. The 2020 survey
        data was used as the sample, which contained a total of 21,057 individuals.
        The study variables were analyzed in sequence for reliability and validity,
        correlation analysis, regression analysis, structural equation model testing,
        and bias-corrected percentile Bootstrap testing using SPSS 23.0 software and
        Hayes' (2013) Process plug-in.<h4>Results</h4>Physical exercise was significantly
        positively correlated with self-assessed health status and satisfaction of
        life (<i>\u03B2</i> = 0.049, <i>p</i> < 0.01; <i>\u03B2</i> = 0.075, <i>p</i>
        < 0.01), and significantly negatively correlated with risk of depression (<i>\u03B2</i>
        = -0.022, <i>p</i> < 0.01); self-assessed health status was significantly
        positively correlated with satisfaction of life (<i>\u03B2</i> = 0.440, <i>p</i>
        < 0.01), and significantly negatively correlated with risk of depression (<i>\u03B2</i>
        = -0.047, <i>p</i> < 0.01); satisfaction of life was significantly negatively
        correlated with risk of depression (<i>\u03B2</i> = -0.137, <i>p</i> < 0.01).<h4>Conclusion</h4>Physical
        exercise not only negatively predicted the risk of depression, but also indirectly
        predicted the risk of depression through the independent mediating effects
        of self-assessed health status and satisfaction of life, as well as chain
        mediating effects. There were no differences in the effects of physical exercise
        on depression risk by age, gender and marital status. Significant differences
        in the effect of physical exercise on depression risk were found among groups
        with different places of residence.\",\"affiliation\":\"Xu Hai College, China
