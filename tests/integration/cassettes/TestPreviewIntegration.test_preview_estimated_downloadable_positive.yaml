        AI technique to identify depression risk among doctoral students.\",\"authorString\":\"Teng
        C, Yang C, Liu Q.\",\"authorList\":{\"author\":[{\"fullName\":\"Teng C\",\"firstName\":\"Changhong\",\"lastName\":\"Teng\",\"initials\":\"C\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"School
