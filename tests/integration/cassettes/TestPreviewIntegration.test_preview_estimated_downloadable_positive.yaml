        U.S. science and engineering undergraduates who struggle with mental health
        are left without role models.\",\"authorString\":\"Busch CA, Barstow M, Brownell
        SE, Cooper KM.\",\"authorList\":{\"author\":[{\"fullName\":\"Busch CA\",\"firstName\":\"Carly
        A\",\"lastName\":\"Busch\",\"initials\":\"CA\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-3744-1702\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"School
