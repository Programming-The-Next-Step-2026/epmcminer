        Ryu HH, Ryu SJ.\",\"authorList\":{\"author\":[{\"fullName\":\"Jung E\",\"firstName\":\"Eujene\",\"lastName\":\"Jung\",\"initials\":\"E\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0003-3802-5636\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
