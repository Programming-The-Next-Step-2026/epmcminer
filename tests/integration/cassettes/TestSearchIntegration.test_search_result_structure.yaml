        by\",\"hasEvaluations\":\"N\",\"authMan\":\"N\",\"epmcAuthMan\":\"N\",\"nihAuthMan\":\"N\",\"hasTMAccessionNumbers\":\"N\",\"dateOfCreation\":\"2026-05-27\",\"firstIndexDate\":\"2026-05-27\",\"fullTextReceivedDate\":\"2026-05-27\",\"dateOfRevision\":\"2026-05-27\",\"firstPublicationDate\":\"2026-05-27\"},{\"id\":\"42143768\",\"source\":\"MED\",\"pmid\":\"42143768\",\"pmcid\":\"PMC13180441\",\"fullTextIdList\":{\"fullTextId\":[\"PMC13180441\"]},\"doi\":\"10.1002/cre2.70379\",\"title\":\"Evaluation
