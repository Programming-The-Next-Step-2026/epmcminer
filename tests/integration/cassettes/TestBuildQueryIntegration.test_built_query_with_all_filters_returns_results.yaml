        technology assessment (Winchester, England)\",\"medlineAbbreviation\":\"Health
        Technol Assess\",\"essn\":\"2046-4924\",\"issn\":\"1366-5278\",\"isoabbreviation\":\"Health
        Technol Assess\",\"nlmid\":\"9706284\"}},\"pubYear\":\"2024\",\"pageInfo\":\"1-26\",\"abstractText\":\"<h4>Background</h4>Prevalence
        of depression is increasing in young people. Behaviour change interventions
        providing benefits equal to or greater than talking therapies or pharmacological
        alternatives are needed. Exercise could be beneficial for young people with
        depression, but we lack robust trials of its effectiveness.<h4>Objective</h4>To
        test whether an exercise intervention targeting young people with depression
        is feasible, including recruitment and retention of young people, recruitment
        and training of exercise professionals and intervention delivery.<h4>Design</h4>Three-arm
        cluster feasibility randomised controlled trial with embedded process evaluation
        and health economic data collection.<h4>Setting</h4>Local community venues
        in Hertfordshire, Bedfordshire and Norfolk.<h4>Participants</h4>Young people
        aged 13-17 years experiencing mild to moderate low mood or depression (indicated
        by scoring 17-36 on the Child Depression Inventory version 2) identified by
        mental health services, schools or self-referral.<h4>Interventions</h4>Participants
        were randomised to one of three groups: high-intensity exercise, low-intensity
        exercise or a social activity control. Group sessions ran twice-weekly for
        12 weeks delivered by registered exercise professionals, supported by mental
        health support workers.<h4>Main outcome measures</h4>Referral, recruitment
        and retention rates; attendance at group sessions; adherence to and ability
        to reach intensity during exercise sessions; proportions of missing data,
        and adverse events measured at baseline and at 3 and 6 months; resource use;
        and reach and representativeness.<h4>Results</h4>Of 321 referrals to the study,
        173 were assessed for eligibility, and of the target sample size of 81, 15
        were recruited and 14 were randomised (one withdrew). The retention rate was
        71.4% and attendance at intervention sessions was >\u200567%; data completeness
        was >\u200580% for baseline assessments. Follow-up completion rate at 14 weeks
        was >\u200580% for most outcomes, with 50% for accelerometer data in the low-intensity
        group. Trial processes and the intervention were acceptable to young people.
        Barriers to and facilitators of intervention delivery were identified.<h4>Limitations</h4>Findings
        highlighted challenges around recruitment, delivery of exercise interventions
        and informed ways of addressing barriers to recruitment for future studies.
        The study was conducted between October 2020 and August 2022 and consequently
        the COVID-19 pandemic had a disruptive impact on implementation.<h4>Conclusions</h4>A
        large randomised trial of the effectiveness of the intervention is not feasible
        using the current study design, but issues relating to recruitment could be
        addressed with further work.<h4>Future work</h4>Developing appropriate recruitment
        strategies via triage services, general practitioner practices, schools and
        social media and early engagement with the local Clinical Research Network
        to support recruitment to the study would address the significant shortfalls
        identified. Young people who are deemed unsuitable for mental health services
        should be followed up to be offered participation in such interventions. Collaborations
        between the NHS services and sports delivery partners should consider in-person
        contact with young people rather than remote consultations. Recruiting through
        general practitioner practices is effective and relatively inexpensive. The
        role of community engagement (socialmedia, public health agencies, community
        groups) needs to be further explored. Strong public and patient involvement
        and engagement via young people advisory groups is important to ensure that
        research is relevant to young people.<h4>Funding</h4>This article presents
        independent research funded by the National Institute for Health and Care
        Research (NIHR) Health Technology Assessment programme as award number 17/78/10.\",\"affiliation\":\"Centre
