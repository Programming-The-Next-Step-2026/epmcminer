        technology assessment (Winchester, England)\",\"medlineAbbreviation\":\"Health
        Technol Assess\",\"essn\":\"2046-4924\",\"issn\":\"1366-5278\",\"isoabbreviation\":\"Health
        Technol Assess\",\"nlmid\":\"9706284\"}},\"pubYear\":\"2024\",\"pageInfo\":\"1-155\",\"abstractText\":\"<h4>Background</h4>Chronic
        pain is common and costly. Antidepressants are prescribed to reduce pain.
        However, there has not been a network meta-analysis examining all antidepressants
        across all chronic pain conditions, so effectiveness and safety for most antidepressants
        for pain conditions remain unknown.<h4>Objective</h4>To assess the efficacy
        and safety of antidepressants for chronic pain (except headache) in adults.
        Our primary outcomes were as follows: substantial pain relief (50%), pain
        intensity, mood and adverse events. Our secondary outcomes were as follows:
        moderate pain relief (30%), physical function, sleep, quality of life, Patient
        Global Impression of Change, serious adverse events and withdrawal.<h4>Design</h4>This
        was a systematic review with a network meta-analysis. We searched CENTRAL,
        MEDLINE, EMBASE, CINAHL, LILACS, AMED and PsycINFO databases for randomised
        controlled trials of antidepressants for chronic pain conditions up until
        4 January 2022. The review was registered in PROSPERO (CRD42020171855), and
        the protocol was published in the Cochrane Library (https://doi.org/10.1002/14651858.CD014682).<h4>Setting</h4>We
        analysed trials from all settings.<h4>Participants</h4>We included trials
        in which participants had chronic pain, defined as longer than 3 months, from
        any condition excluding headache.<h4>Interventions</h4>We included all antidepressants.<h4>Main
        outcome measures</h4>Our primary outcome was substantial pain relief, defined
        as a reduction \u02C3\u200550%. We also measured pain intensity, mood and
        adverse events. Secondary measures included moderate pain relief (above 30%
        reduction), physical function, sleep, quality of life, Global Impression of
        Change, serious adverse events, and withdrawal from trial.<h4>Results</h4>We
        identified 176 studies with a total of 28,664 participants. Most studies were
        placebo-controlled (<i>n</i> = 83) and parallel armed (<i>n</i> = 141). The
        most common pain conditions examined were fibromyalgia (59 studies), neuropathic
        pain (49 studies) and musculoskeletal pain (40 studies). The average length
        of randomised controlled trials was 10 weeks. Most studies measured short-term
        outcomes only and excluded people with low mood and other mental health conditions.
        Across efficacy outcomes, duloxetine was consistently the highest-ranked antidepressant
        with moderate- to high-certainty evidence. Standard dose was equally efficacious
        as high dose for the majority of outcomes. Milnacipran was often ranked as
        the next most efficacious antidepressant, although the certainty of evidence
        was lower than that for duloxetine. There was insufficient evidence to draw
        robust conclusions for the efficacy and safety of any other antidepressant
        for chronic pain.<h4>Limitations</h4>The evidence for antidepressants other
        than duloxetine is poor. For duloxetine, it is not clear whether the effect
        applies to groups with both pain and low mood, since these groups were excluded
        from trials. There is also insufficient evidence on long-term outcomes and
        on adverse effects.<h4>Conclusions</h4>There is only reliable evidence for
        duloxetine in the treatment of chronic pain. Duloxetine was moderately efficacious
        across all outcomes at standard dose. There is also promising evidence for
        milnacipran, although further high-quality research is needed to be confident
        in these conclusions. Data for all other antidepressants were of low certainty.
        However, the findings should not be read as an encouragement to prescribe
        antidepressants where other non-pharmacological intervention could be equally
        effective, especially in the absence of good evidence on side effects and
        safety.<h4>Future work</h4>There is a need for large, methodologically sound
        trials testing the effectiveness of antidepressants for chronic pain. These
        trials should examine long-term outcomes (> 6 months) and include people with
        low mood. There should also be better reporting of adverse events, tolerance
        of drugs, and long-term compliance.<h4>Study registration</h4>This study is
        registered as PROSPERO CRD42020171855.<h4>Funding</h4>This award was funded
        by the National Institute for Health and Care Research (NIHR) Health Technology
        Assessment programme (NIHR award ref: NIHR128782) and is published in full
        in <i>Health Technology Assessment</i>; Vol. 28, No. 62. See the NIHR Funding
        and Awards website for further award information.\",\"affiliation\":\"Department
