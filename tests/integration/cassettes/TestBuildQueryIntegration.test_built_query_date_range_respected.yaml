        the hospital anxiety and depression scale in people with epilepsy: Is overlapping
        symptomatology a problem?\",\"authorString\":\"Tye E, Baxendale S.\",\"authorList\":{\"author\":[{\"fullName\":\"Tye
        E\",\"firstName\":\"Elisa\",\"lastName\":\"Tye\",\"initials\":\"E\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"University
        College Hospital, London, United Kingdom.\"}]}},{\"fullName\":\"Baxendale
        S\",\"firstName\":\"Sallie\",\"lastName\":\"Baxendale\",\"initials\":\"S\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-9930-6469\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"University
