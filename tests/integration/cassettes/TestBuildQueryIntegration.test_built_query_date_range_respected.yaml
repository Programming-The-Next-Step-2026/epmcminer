        Dec\",\"monthOfPublication\":12,\"yearOfPublication\":2023,\"printPublicationDate\":\"2023-12-01\",\"journal\":{\"title\":\"Nutrients\",\"medlineAbbreviation\":\"Nutrients\",\"essn\":\"2072-6643\",\"issn\":\"2072-6643\",\"isoabbreviation\":\"Nutrients\",\"nlmid\":\"101521595\"}},\"pubYear\":\"2023\",\"pageInfo\":\"125\",\"abstractText\":\"Western
        dietary patterns (WDP) and typical food groups may play a major role in the
        risk of behavioral health disorders. Nevertheless, the relationships between
        WDP, common food categories, and mental health disorders lack consistency
        and remain incompletely understood in relation to potential mechanisms. Therefore,
        the objective of the present study was conducted to synthesize available evidence
        linking WDP and typical food groups to these outcomes. Web of Science, PubMed,
        EMBASE, and MEDLINE were searched up to August 2023. Random effect meta-analyses
        were performed to obtain pooled odds ratio and the relative risk for the prevalence
        of outcomes and the incidence of outcomes, respectively. A total of 54 articles
        were included. WDP was associated with increased risk of both depression (1.19;
        95% CI: 1.06-1.32) and depressive symptoms (1.20; 95% CI: 1.08-1.34). Except
        for high-fat dairy products, food groups are associated with an increased
        risk of anxiety, depression, and depressive symptoms. This review presents
        evidence to further understand the relationship between WDP, typical food
        groups, and the incidence of behavioral health disorders, and more randomized
        controlled trials and cohort studies are urgently required to confirm these
        findings and elucidate potential mechanisms.\",\"affiliation\":\"School of
        Food Science and Bioengineering, Henan University of Animal Husbandry and
        Economy, No. 6, Longzihu North Road, Zhengzhou 450046, China.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic\",\"pubTypeList\":{\"pubType\":[\"Meta-Analysis\",\"Systematic
