        the Barriers Fathers Face to Seeking Help for Paternal Perinatal Depression:
        Comparing Fathers to Men Outside the Perinatal Period.\",\"authorString\":\"Reay
        M, Mayers A, Knowles-Bevis R, Knight MTD.\",\"authorList\":{\"author\":[{\"fullName\":\"Reay
