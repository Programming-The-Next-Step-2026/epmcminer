        journal of environmental research and public health\",\"medlineAbbreviation\":\"Int
        J Environ Res Public Health\",\"essn\":\"1660-4601\",\"issn\":\"1661-7827\",\"isoabbreviation\":\"Int
        J Environ Res Public Health\",\"nlmid\":\"101238455\"}},\"pubYear\":\"2023\",\"pageInfo\":\"16\",\"abstractText\":\"Research
        has shown that men are less likely than women to seek help for depression
        at any time of life due to barriers, including stereotypical masculine norms
        and stigma. The evidence suggests that approximately 10% of fathers experience
        postnatal depression, yet new and expectant fathers are not routinely offered
        screening or support in the same way as mothers. Therefore, this research
        explored the barriers fathers face to seeking help for paternal perinatal
        depression (PPD). Data were collected using an online survey. Initially, fathers
        with postnatal depression were compared to men experiencing depression at
        another time of their life in terms of their attitudes to seeking psychological
        help, conformity to masculine norms, self-stigma, and awareness of services.
        Secondly, a proposed model of help-seeking amongst fathers with postnatal
        depression was evaluated. Finally, additional barriers to help-seeking for
        paternal postnatal depression were explored qualitatively. A total of 125
        participants took part in the quantitative comparison, and 50 of the fathers
        also provided qualitative data. No between-group differences were found, suggesting
        that the existing literature on barriers to seeking help for male depression
        is applicable to fathers with postnatal depression. The qualitative results
        also highlighted the need for better awareness of paternal postnatal depression
        and better access to services for fathers. Limitations, implications for policy,
        and directions for future research are discussed.\",\"affiliation\":\"Oxford
        Health NHS Foundation Trust, The University of Oxford, Oxford OX4 4XN, UK.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
