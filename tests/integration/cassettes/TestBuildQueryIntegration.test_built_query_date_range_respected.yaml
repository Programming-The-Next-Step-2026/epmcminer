        Mar\",\"monthOfPublication\":3,\"yearOfPublication\":2024,\"printPublicationDate\":\"2024-03-01\",\"journal\":{\"title\":\"Journal
        of affective disorders\",\"medlineAbbreviation\":\"J Affect Disord\",\"issn\":\"0165-0327\",\"essn\":\"1573-2517\",\"isoabbreviation\":\"J
        Affect Disord\",\"nlmid\":\"7906073\"}},\"pubYear\":\"2024\",\"pageInfo\":\"32-38\",\"abstractText\":\"<h4>Objective</h4>Seasonal
        patterns are often undetectable in population-based depression studies, calling
        into question the existence of winter seasonal affective disorder (SAD). If
        SAD has construct validity, individuals with SAD should show spontaneous depression
        remission in the summer. Data are sparse on prospectively assessed summer
        mood status in confirmed SAD patients.<h4>Method</h4>We conducted prospective
        summer followup of community adults who, the winter before, were diagnosed
        with Major Depression, Recurrent with Seasonal Pattern on the Structured Clinical
        Interview for DSM-IV Axis I Disorders, developed a current SAD episode on
        the Structured Interview Guide for the Hamilton Rating Scale for Depression-Seasonal
        Affective Disorder Version (SIGH-SAD), and enrolled in a clinical trial comparing
        group cognitive-behavioral therapy for SAD and light therapy. In July/August
        after treatment, 143/153 (93.5\_%) participants provided data on the SIGH-SAD,
        the Beck Depression Inventory-Second Edition, and the Longitudinal Interval
        Followup Evaluation (LIFE).<h4>Results</h4>Summer mean depression scores were
        in the normal range, with the substantial majority in remission across different
        measures. On the LIFE, 113/143 (79.0\_%) experienced complete summer remission,
        19/143 (13.3\_%) experienced partial summer remission, and 11/143 (7.7\_%)
        had major depression in the summer. Depression scores were significantly lower
        at summer than post-treatment in both treatments, indicating incomplete treatment
        response.<h4>Limitations</h4>This was a single-site study with a relatively
        homogeneous sample.<h4>Conclusions</h4>Supporting construct validity for SAD,
        the substantial majority experienced complete summer remission, with a minority
        in partial remission and a very small minority in episode. Both treatments
        left residual symptoms at treatment endpoint compared to summer.\",\"affiliation\":\"Department
