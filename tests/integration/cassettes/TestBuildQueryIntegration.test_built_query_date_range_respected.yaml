        \",\"monthOfPublication\":0,\"yearOfPublication\":2024,\"printPublicationDate\":\"2024-01-01\",\"journal\":{\"title\":\"Psychology
        research and behavior management\",\"medlineAbbreviation\":\"Psychol Res Behav
        Manag\",\"essn\":\"1179-1578\",\"isoabbreviation\":\"Psychol Res Behav Manag\",\"issn\":\"1179-1578\",\"nlmid\":\"101514563\"}},\"pubYear\":\"2024\",\"pageInfo\":\"4315-4329\",\"abstractText\":\"<h4>Purpose</h4>Prior
        research has indicated that mobile phone addiction (MPA) significantly contributes
        to depression. However, there is a research gap in exploring the distinct
        impacts of various types of MPA on depression, along with the potential moderating
        effect of gender. The current study investigated whether the relationship
        between MPA and depression varies depending on the types of MPA and gender.<h4>Methods</h4>A
        one-year longitudinal study was undertaken at two high schools in Central
        China. Data was gathered at two time points (Time 1/T1 and Time 2/T2) with
        a one-year gap between assessments. A total of 480 adolescents, aged 12 to
        19 years old, completed all questionnaires assessing four types of mobile
        phone addiction at T1, as well as depression at T1 and T2.<h4>Results</h4>The
        findings demonstrated significant positive associations between all four types
        of MPA at T1 and depression at T2. Additionally, gender was found to moderate
        the associations between three types of MPA and depression. Specifically,
        among girls, T1 social media addiction had a stronger predictive effect on
        T2 depression compared to boys. Conversely, among boys, T1 game addiction
        had a more pronounced predictive effect on T2 depression, which was less significant
        among girls. Moreover, in boys, T1 short-form video addiction had a noteworthy
        predictive effect on T2 depression, but this effect was not significant in
        girls. However, it is worth noting that T1 information acquisition addiction
        had a significant predictive effect on T2 depression in both boys and girls,
        with no noticeable gender difference.<h4>Conclusion</h4>The current study
        has enhanced our understanding of the impact of MPA on mental health by examining
        the correlation between different types of MPA and depression across genders.
        The findings provide valuable insights for reducing depression among adolescents
        of different genders by considering their mobile phone usage patterns.\",\"affiliation\":\"Institute
        for Public Policy and Social Management Innovation, College of Political Science
        and Public Administration, Henan Normal University, Xinxiang, People's Republic
        of China.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
