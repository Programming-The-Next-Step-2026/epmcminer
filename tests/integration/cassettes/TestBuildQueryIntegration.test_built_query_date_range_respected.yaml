        analysis of mental influencing factors for anxiety and depression of rural
        and urban freshmen.\",\"authorString\":\"Li C, Sun B.\",\"authorList\":{\"author\":[{\"fullName\":\"Li
        C\",\"firstName\":\"Chang\",\"lastName\":\"Li\",\"initials\":\"C\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"College
