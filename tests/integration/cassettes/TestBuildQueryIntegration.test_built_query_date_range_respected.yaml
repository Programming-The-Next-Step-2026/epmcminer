        supplementation beneficially affects depression in adults with depressive
        disorder: a systematic review and meta-analysis of randomized clinical trials.\",\"authorString\":\"Moabedi
        M, Aliakbari M, Erfanian S, Milajerdi A.\",\"authorList\":{\"author\":[{\"fullName\":\"Moabedi
        M\",\"firstName\":\"Mahdi\",\"lastName\":\"Moabedi\",\"initials\":\"M\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0009-0001-0845-3835\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Student
        Research Committee, Kashan University of Medical Sciences, Kashan, Iran.\"}]}},{\"fullName\":\"Aliakbari
        M\",\"firstName\":\"Mohammadreza\",\"lastName\":\"Aliakbari\",\"initials\":\"M\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Student
        Research Committee, Kashan University of Medical Sciences, Kashan, Iran.\"}]}},{\"fullName\":\"Erfanian
        S\",\"firstName\":\"Shima\",\"lastName\":\"Erfanian\",\"initials\":\"S\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Student
        Research Committee, Isfahan University of Medical Sciences, Isfahan, Iran.\"}]}},{\"fullName\":\"Milajerdi
        A\",\"firstName\":\"Alireza\",\"lastName\":\"Milajerdi\",\"initials\":\"A\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Research
        Center for Biochemistry and Nutrition in Metabolic Diseases, Institute for
        Basic Sciences, Kashan University of Medical Sciences, Kashan, Iran.\"}]}}]},\"authorIdList\":{\"authorId\":[{\"type\":\"ORCID\",\"value\":\"0009-0001-0845-3835\"}]},\"dataLinksTagsList\":{\"dataLinkstag\":[\"altmetrics\",\"supporting_data\"]},\"journalInfo\":{\"volume\":\"14\",\"journalIssueId\":3497158,\"dateOfPublication\":\"2023
        \",\"monthOfPublication\":0,\"yearOfPublication\":2023,\"printPublicationDate\":\"2023-01-01\",\"journal\":{\"title\":\"Frontiers
        in psychiatry\",\"medlineAbbreviation\":\"Front Psychiatry\",\"essn\":\"1664-0640\",\"isoabbreviation\":\"Front
        Psychiatry\",\"issn\":\"1664-0640\",\"nlmid\":\"101545006\"}},\"pubYear\":\"2023\",\"pageInfo\":\"1333261\",\"abstractText\":\"<h4>Background</h4>The
        findings from randomized clinical trials (RCTs) examining the effect of magnesium
        supplementation on depression are inconsistent. We decided to conduct a meta-analysis
        that summarizes all the evidence on the impact of magnesium supplementation
        on depression scores in adults with depressive disorder.<h4>Methods</h4>We
        conducted a systematic search in the online databases using all related keywords
        up to July 2023. We included all randomized clinical trials examining the
        effect of magnesium, in contrast to placebo, on depression scores.<h4>Results</h4>Finally,
        seven clinical trials were included in this systematic review, building up
        a total sample size of 325 individuals with ages ranging from 20 to 60\u2009years
        on average. These RCTs resulted in eight effect sizes. Our findings from the
        meta-analysis showed a significant decline in depression scores due to intervention
        with magnesium supplements [standardized mean difference (SMD): -0.919, 95%
        CI: -1.443 to -0.396, <i>p</i>\u2009=\u20090.001].<h4>Conclusion</h4>Our review
        suggests that magnesium supplementation can have a beneficial effect on depression.
        Future high-quality RCTs with larger sample sizes must be run to interpret
        this effect of magnesium on depression in clinical settings.<h4>Systematic
        review registration</h4>https://www.crd.york.ac.uk/prospero/display_record.php?RecordID=447909.\",\"affiliation\":\"Student
