        & colitis 360\",\"medlineAbbreviation\":\"Crohns Colitis 360\",\"issn\":\"2631-827X\",\"essn\":\"2631-827X\",\"isoabbreviation\":\"Crohns
        Colitis 360\",\"nlmid\":\"101752188\"}},\"pubYear\":\"2024\",\"pageInfo\":\"otad080\",\"abstractText\":\"<h4>Background</h4>Longitudinal
        research reveals a unidirectional relationship between a nonsomatic symptom
        of depression, a negative view of the self, and later reported Crohn's disease
        (CD) activity. We evaluated whether health behaviors mediated this association
        using a longitudinal design.<h4>Methods</h4>We studied 3304 adult volunteers
        with a self-reported diagnosis of CD who completed a baseline survey that
        included demographics, CD activity, a symptom-specific index of depression,
        and measures of physical activity, smoking, and sleep quality. Crohn's disease
        status and the cognitive index of depression were also measured 6 and 12 months
        after the baseline evaluation. We specified single-mediator and multiple-mediator
        models to elucidate the depression-disease activity relationship.<h4>Results</h4>Among
        2395 females and 909 males, we found a significant mediation effect for activity
        level (<i>P</i> < .001) after adjusting for age, sex, and body mass index.
        There was no evidence that sleep quality and smoking are significant single
        mediators. When we considered multiple mediation models, smoking and less
        activity partially mediate the depression-CD association.<h4>Conclusions</h4>Smoking
        and lower levels of physical activity are potential mediators of the unidirectional
        association between a nonsomatic symptom of depression-a negative view of
        the self-and patient-reported CD activity. Evaluating and treating specific
        symptoms of depression may reduce the frequency of CD exacerbations.\",\"affiliation\":\"Department
        of Psychiatry and Behavioral Sciences, Vanderbilt University Medical Center,
        Nashville, TN, USA.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
