        C, Boivin DB.\",\"authorList\":{\"author\":[{\"fullName\":\"Moderie C\",\"firstName\":\"Christophe\",\"lastName\":\"Moderie\",\"initials\":\"C\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-4486-9838\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
