        Between Forced Intercourse and Subsequent Depression Among Women in the U.S.
        General Population.\",\"authorString\":\"Bruffaerts R, Axinn WG.\",\"authorList\":{\"author\":[{\"fullName\":\"Bruffaerts
        R\",\"firstName\":\"Ronny\",\"lastName\":\"Bruffaerts\",\"initials\":\"R\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-0330-3694\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Center
