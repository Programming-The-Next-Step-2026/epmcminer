        G\",\"lastName\":\"Axinn\",\"initials\":\"WG\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-0496-0485\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Institute
        for Social Research, University of Michigan, 426 Thompson St., PO Box 1248,
