        the effects of stress on antenatal depression mediated by self-esteem and
        moderated by social support?: a cross-sectional study.\",\"authorString\":\"Lee
        E.\",\"authorList\":{\"author\":[{\"fullName\":\"Lee E\",\"firstName\":\"Eunjoo\",\"lastName\":\"Lee\",\"initials\":\"E\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
