        \",\"monthOfPublication\":0,\"yearOfPublication\":2023,\"printPublicationDate\":\"2023-01-01\",\"journal\":{\"title\":\"Frontiers
        in psychiatry\",\"medlineAbbreviation\":\"Front Psychiatry\",\"issn\":\"1664-0640\",\"essn\":\"1664-0640\",\"isoabbreviation\":\"Front
        Psychiatry\",\"nlmid\":\"101545006\"}},\"pubYear\":\"2023\",\"pageInfo\":\"1333261\",\"abstractText\":\"<h4>Background</h4>The
        findings from randomized clinical trials (RCTs) examining the effect of magnesium
        supplementation on depression are inconsistent. We decided to conduct a meta-analysis
        that summarizes all the evidence on the impact of magnesium supplementation
        on depression scores in adults with depressive disorder.<h4>Methods</h4>We
        conducted a systematic search in the online databases using all related keywords
        up to July 2023. We included all randomized clinical trials examining the
        effect of magnesium, in contrast to placebo, on depression scores.<h4>Results</h4>Finally,
        seven clinical trials were included in this systematic review, building up
        a total sample size of 325 individuals with ages ranging from 20 to 60\u2009years
        on average. These RCTs resulted in eight effect sizes. Our findings from the
        meta-analysis showed a significant decline in depression scores due to intervention
        with magnesium supplements [standardized mean difference (SMD): -0.919, 95%
        CI: -1.443 to -0.396, <i>p</i>\u2009=\u20090.001].<h4>Conclusion</h4>Our review
        suggests that magnesium supplementation can have a beneficial effect on depression.
        Future high-quality RCTs with larger sample sizes must be run to interpret
        this effect of magnesium on depression in clinical settings.<h4>Systematic
        review registration</h4>https://www.crd.york.ac.uk/prospero/display_record.php?RecordID=447909.\",\"affiliation\":\"Student
        Research Committee, Kashan University of Medical Sciences, Kashan, Iran.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"Systematic
        Review\",\"systematic-review\",\"Journal Article\"]},\"keywordList\":{\"keyword\":[\"Magnesium\",\"Meta-analysis\",\"Adults\",\"Clinical
