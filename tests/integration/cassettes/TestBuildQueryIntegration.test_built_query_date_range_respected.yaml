        Associations of Vitamin D with Ovarian Reserve Markers and Depression: A Narrative
        Literature Review.\",\"authorString\":\"Jeon GH.\",\"authorList\":{\"author\":[{\"fullName\":\"Jeon
        GH\",\"firstName\":\"Gyun-Ho\",\"lastName\":\"Jeon\",\"initials\":\"GH\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0003-1128-1656\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
        of Obstetrics and Gynecology, Haeundae Paik Hospital, Inje University School
        of Medicine, Busan 48108, Republic of Korea.\"}]}}]},\"authorIdList\":{\"authorId\":[{\"type\":\"ORCID\",\"value\":\"0000-0003-1128-1656\"}]},\"dataLinksTagsList\":{\"dataLinkstag\":[\"altmetrics\"]},\"journalInfo\":{\"issue\":\"1\",\"volume\":\"16\",\"journalIssueId\":3694915,\"dateOfPublication\":\"2023
        Dec\",\"monthOfPublication\":12,\"yearOfPublication\":2023,\"printPublicationDate\":\"2023-12-01\",\"journal\":{\"title\":\"Nutrients\",\"medlineAbbreviation\":\"Nutrients\",\"essn\":\"2072-6643\",\"isoabbreviation\":\"Nutrients\",\"issn\":\"2072-6643\",\"nlmid\":\"101521595\"}},\"pubYear\":\"2023\",\"pageInfo\":\"96\",\"abstractText\":\"Since
        the identification of vitamin D receptors in both the female reproductive
        tract and the central nervous system, further data have shown that vitamin
        D is involved in the processes of reproductive and mental health. This paper
        reviews current research on the associations of vitamin D with ovarian reserve
        markers and depression and discusses the potential role of vitamin D in their
        relationships. There have been numerous studies reporting that vitamin D was
        significantly related to ovarian reserve markers and depression in basic or
        clinical research, but some observational and interventional clinical studies
        have shown inconsistent results. Nevertheless, recent meta-analyses of interventional
        studies have provided promising results showing that vitamin D supplementation
        significantly improves ovarian reserve metrics, especially in a subgroup of
        women with normal or diminished ovarian reserve, and decreases depressive
        symptoms and risk. The demonstration of an association of vitamin D with both
        ovarian reserve and depression could suggest that vitamin D may be another
        important key in explaining female reproductive depression. Larger-scale studies
        in standardized settings will be needed in order to gain further insight into
        the role of vitamin D in female reproduction and depression.\",\"affiliation\":\"Department
        of Obstetrics and Gynecology, Haeundae Paik Hospital, Inje University School
        of Medicine, Busan 48108, Republic of Korea.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic\",\"pubTypeList\":{\"pubType\":[\"review-article\",\"Review\",\"Journal
        Article\"]},\"grantsList\":{\"grant\":[{\"grantId\":\"2022R1G1A1011532\",\"agency\":\"National
