        Dec\",\"monthOfPublication\":12,\"yearOfPublication\":2026,\"printPublicationDate\":\"2026-12-01\",\"journal\":{\"title\":\"European
        journal of psychotraumatology\",\"medlineAbbreviation\":\"Eur J Psychotraumatol\",\"essn\":\"2000-8066\",\"issn\":\"2000-8066\",\"nlmid\":\"101559025\",\"isoabbreviation\":\"Eur
        J Psychotraumatol\"}},\"pubYear\":\"2026\",\"pageInfo\":\"2660607\",\"abstractText\":\"<b>Background:</b>
        Despite the increased attention paid to the separate effects of cumulative
        adversities and protection on mental health, the extent to which distinct
        clusters of risk and protective factors exist and have special effects on
        depression and anxiety symptom trajectories remains under-explored.<b>Objective:</b>
        To explore the effects of clusters of childhood adverse experiences and positive
        experiences on depression and anxiety symptom trajectories.<b>Methods:</b>
        A longitudinal study was conducted at two colleges in Anhui province, China,
        between October 2022 and November 2023. Questionnaires were administered to
        4,764 first-year students anonymously, requesting information regarding their
        adverse childhood experiences (ACEs), positive childhood experiences (PCEs),
        depression and anxiety symptoms. Latent class analysis was utilized to identify
        classes based on ACEs and PCEs. Latent class growth analysis was used to recognize
        trajectories of depression and anxiety symptoms. Two models were conducted
        using regression analysis. The correlation between a single type of ACEs and
        PCEs and clusters and depression and anxiety symptom trajectories was explored.<b>Results:</b>
        Three classes of ACEs and PCEs clusters were identified, comprising between
        17.8% and 61.% of the sample each. Three distinct classes were identified
        for trajectories of depression and anxiety symptoms. Those who were referred
        to trajectory 1 ('low depression symptoms reducing') were found to be at an
        increased risk of developing 'high depression symptoms increasing' and 'moderate
        depression symptoms stabilized', when compared with those in class 3 ('low
        risk and high protection'). This was also the case for anxiety symptom trajectories.<b>Conclusion:</b>
        It is not only the case that distinct categories of ACEs and PCEs exist; furthermore,
        these groups exhibit varying probabilities of future depression and anxiety
        symptom trajectories. It is evident that a child's preventative measures of
        ACEs are likely to be of greater consequence than positive protection.\",\"affiliation\":\"Department
        of Maternal, Child & Adolescent Health, Center for Big Data and Population
        Health of IHM, School of Public Health, Anhui Medical University, Hefei, People's
        Republic of China.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
