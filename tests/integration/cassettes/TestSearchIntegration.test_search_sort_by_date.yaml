        medicine: X\",\"medlineAbbreviation\":\"Sleep Med X\",\"essn\":\"2590-1427\",\"issn\":\"2590-1427\",\"isoabbreviation\":\"Sleep
        Med X\",\"nlmid\":\"101774782\"}},\"pubYear\":\"2026\",\"pageInfo\":\"100190\",\"abstractText\":\"<h4>Background</h4>A
        screening tool for obstructive sleep apnoea (OSA) is useful in low-income
        countries where it may be difficult to access sleep recordings. The objective
        of this study was to assess the performance of six screening scores compared
        with objective sleep recording.<h4>Methods</h4>This analysis is based on the
        \\\"Benin Sleep and Society\\\" (BeSAS) study, in which respiratory polygraphy
        (PG) was performed using a type III device and OSA screening questionnaires
        (STOP, STOP-Bang, Berlin, NOSAS [\u22658 and\_\u2265\_5), No-Apnea, GOAL)
        were administered to participants. PG-defined OSA severity categories were
        defined according to the apnoea-hypopnoea index (AHI): mild (AHI 5 to <15/h),
        moderate (AHI 15 to <30/h) or severe (AHI \u226530/h), and these were compared
        to score findings.<h4>Results</h4>A total of 1810 subjects (mean age 45.4\_\xB1\_14.6
        years; 64.3% women) were included. For moderate to severe OSA, the area under
        the receiver operating characteristic curve was greatest for GOAL and No-Apnea
        (0.70, CI 0.67-0.73; 0.70, CI 0.68-0.73), followed by NoSAS<sub>5</sub> (0.69,
        CI 0.65-0.73). The highest sensitivity values were for NoSAS<sub>5</sub> (0.73,
        CI 0.67-0.79), No-Apnea (0.72, CI 0.66-0.78), and GOAL (0.69, CI 0.67-0.79),
        while NoSAS<sub>8</sub> had the highest specificity (0.91, CI 0.90-0.93),
        followed by Berlin (0.88, CI 0.87-0.90) and GOAL (0.71, CI 0.69-0.73). All
        scores performed poorly with respect to the positive predictive value (PPV),
        which was highest with NoSAS<sub>8</sub> (0.38, CI 0.31-0.44).<h4>Conclusion</h4>Although
        overall performance was modest for all instruments, NoSAS<sub>8</sub> showed
        the highest PPV among the evaluated scores. These findings suggest that NoSAS<sub>8</sub>
        may be a useful option to support OSA risk stratification in resource-constrained
        settings, but should be interpreted with caution.\",\"affiliation\":\"Faculty
        of Health Sciences, University of Abomey-Calavi, Cotonou, Benin.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
