        journal of oncology nursing\",\"medlineAbbreviation\":\"Asia Pac J Oncol Nurs\",\"essn\":\"2349-6673\",\"issn\":\"2347-5625\",\"isoabbreviation\":\"Asia
        Pac J Oncol Nurs\",\"nlmid\":\"101673157\"}},\"pubYear\":\"2026\",\"pageInfo\":\"100957\",\"abstractText\":\"<h4>Objective</h4>To
        identify the latent profiles of health-promoting lifestyle and explore the
        correlates of these profiles among patients with colorectal cancer.<h4>Methods</h4>A
        total of 561 hospitalized patients with colorectal cancer at a tertiary hospital
        in Guangzhou between July 2023 and June 2024 were enrolled. The Health-Promoting
        Lifestyle Profile II Revised (HPLP-II R) was used to assess health-promoting
        behaviors. Latent profile analysis (LPA) was conducted to identify health-promoting
        lifestyle subgroups. Univariate analysis and multinomial logistic regression
        were performed to examine the association between profiles and sociodemographic
        characteristics, physical frailty, and psychosocial factors.<h4>Results</h4>Four
        distinct health-promoting lifestyle profiles were identified: profile 1 -
        \\\"the comprehensively positive high health-promotion (8.4%)\\\", profile
        2 - \\\"the nutrition-spiritual growth retained low health-promotion (41.5%)\\\",
        profile 3 - \\\"the globally low health-promotion (14.4%)\\\", and profile
        4 - \\\"the balanced moderate health-promotion (35.7%)\\\". Psychological
        frailty and friendship isolation were more likely to be associated with Profile
        2 (<i>OR</i> <i>=</i> 1.799, <i>P</i> <i>=</i> 0.001; <i>OR</i> <i>=</i> 5.484,
        <i>P</i> <i>=</i> 0.043) and Profile 3 (<i>OR</i> <i>=</i> 2.249, <i>P <</i>
        0.001; <i>OR</i> <i>=</i> 11.449, <i>P</i> <i>=</i> 0.005). Patients with
        high depression scores (<i>OR</i> <i>=</i> 4.332, <i>P</i> <i>=</i> 0.015)
        and who are currently smoking (<i>OR</i> <i>=</i> 3.288, <i>P</i> <i>=</i>
        0.025) were more likely to be classified into Profile 3. Profile 1 and Profile
        4 exhibited a difference in per capita monthly household income.<h4>Conclusions</h4>Health-promoting
        lifestyle profiles of patients with colorectal cancer has distinct characteristics.
        These findings provide a basis for nurses to identify high-risk subgroups
        and implement profile-specific, targeted lifestyle interventions in clinical
        practice. Target intervention tailored to each profile's characteristics and
        correlates may modify the lifestyle among patients with colorectal cancer.\",\"affiliation\":\"Sun
        Yat-sen University Cancer Center, State Key Laboratory of Oncology in South
