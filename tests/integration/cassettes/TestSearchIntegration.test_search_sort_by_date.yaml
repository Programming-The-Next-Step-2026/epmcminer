        under pressure: examining widespread trauma exposure and resilience in Israel.\",\"authorString\":\"Netali
        M, Yifat R, Rivka TM.\",\"authorList\":{\"author\":[{\"fullName\":\"Netali
        M\",\"firstName\":\"Mor\",\"lastName\":\"Netali\",\"initials\":\"M\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-3759-5680\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"NATAL
        - Israel Trauma and Resiliency Center, Tel Aviv, Israel.\"}]}},{\"fullName\":\"Yifat
        R\",\"firstName\":\"Reuveni\",\"lastName\":\"Yifat\",\"initials\":\"R\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"NATAL
        - Israel Trauma and Resiliency Center, Tel Aviv, Israel.\"}]}},{\"fullName\":\"Rivka
        TM\",\"firstName\":\"Tuval Mashiach\",\"lastName\":\"Rivka\",\"initials\":\"TM\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-7741-1807\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"NATAL
        - Israel Trauma and Resiliency Center, Tel Aviv, Israel.\"},{\"affiliation\":\"Department
        of Psychology, Bar Ilan University, Ramat Gan, Israel.\"}]}}]},\"authorIdList\":{\"authorId\":[{\"type\":\"ORCID\",\"value\":\"0000-0002-3759-5680\"},{\"type\":\"ORCID\",\"value\":\"0000-0002-7741-1807\"}]},\"journalInfo\":{\"issue\":\"1\",\"volume\":\"17\",\"journalIssueId\":4078786,\"dateOfPublication\":\"2026
        Dec\",\"monthOfPublication\":12,\"yearOfPublication\":2026,\"printPublicationDate\":\"2026-12-01\",\"journal\":{\"title\":\"European
        journal of psychotraumatology\",\"medlineAbbreviation\":\"Eur J Psychotraumatol\",\"essn\":\"2000-8066\",\"issn\":\"2000-8066\",\"nlmid\":\"101559025\",\"isoabbreviation\":\"Eur
        J Psychotraumatol\"}},\"pubYear\":\"2026\",\"pageInfo\":\"2659423\",\"abstractText\":\"<b>Background:</b>
        The 7 October 2023, terrorist attacks and the ensuing war led to widespread
        trauma exposure across Israel. This unprecedented event created a mass collective
        trauma, impacting millions through direct stressors like rocket fire and indirect
        exposure via graphic media. This study provides a novel, population-wide analysis
        of trauma exposure, distress symptoms, and resilience across individual, community,
        and national levels, during a period of prolonged conflict.<b>Objective:</b>
        To examine and characterise the circles of trauma exposure among the Israeli
        civilian population in relation to sociodemographic background, distress levels,
        and multilevel resilience indices following one year of prolonged war.<b>Method:</b>
        A national online survey (<i>N</i>\u2009=\u20091,927) was administered one
        year into the conflict. <i>K</i>-means clustering was used to identify differentiated
        groups based on mental health and resilience measures, further characterised
        by sociodemographic factors and trauma exposure.<b>Results:</b> Findings revealed
        distinct cluster profiles with differing patterns of distress and multi-level
        resilience. The most vulnerable cluster included more women, young adults,
        and low-income individuals and showed high distress alongside low resilience,
        whereas the most resilient profile was characterised by older age, higher
        income, and higher resilience alongside lower distress. Additional clusters
        reflected mixed patterns, including moderate distress with relatively elevated
        resilience. Overall, the results indicate that while trauma exposure is associated
        with distress levels, multi-level resilience indices can co-occur with varying
        levels of distress across profiles.<b>Conclusions:</b> Our study mapped multilevel
        resilience levels during an ongoing conflict and traumatic stress exposure,
        using <i>k</i>-means clustering approach, highlighting the interplay between
        personal, communal, and national factors in relation to mental health outcomes.
        Our findings underscore the importance of addressing resilience holistically,
        incorporating personal coping resources, social networks, and trust in public
        institutions, and further offers an updated perspective on the mutual influence
        between different levels of resilience.\",\"affiliation\":\"NATAL - Israel
        Trauma and Resiliency Center, Tel Aviv, Israel.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
        Article\"]},\"meshHeadingList\":{\"meshHeading\":[{\"majorTopic_YN\":\"N\",\"descriptorName\":\"Humans\"},{\"majorTopic_YN\":\"Y\",\"descriptorName\":\"Stress
