        Int Soc Sports Nutr\",\"essn\":\"1550-2783\",\"issn\":\"1550-2783\",\"isoabbreviation\":\"J
        Int Soc Sports Nutr\",\"nlmid\":\"101234168\"}},\"pubYear\":\"2026\",\"pageInfo\":\"2670564\",\"abstractText\":\"<h4>Background</h4>Sleep
        is crucial for recovery and optimal performance in athletes; however, poor
        sleep is common during periods of intensive training or competition. The microbiota-gut-brain
        axis suggests probiotics and synbiotics could modulate sleep, but evidence
        in exercised populations is limited.<h4>Objective</h4>To systematically review
        randomized controlled trials (RCTs) assessing the effects of probiotic and
        synbiotic supplementation on sleep in exercised populations, using a Synthesis
        Without Meta-analysis (SWiM) approach.<h4>Methods</h4>PubMed, Scopus, Web
        of Science, and ProQuest were searched up to September 2025. Eligible studies
        were RCTs including exercised individuals, testing probiotics or synbiotics,
        and reporting sleep outcomes. Data extraction, risk of bias assessment (RoB
        2), and narrative synthesis followed SWiM guidelines.<h4>Results</h4>Six RCTs
        (<i>n</i>\u2009=\u2009180) were included: four probiotic and two synbiotic
        interventions lasting 4-17 weeks. Populations included athletes from multiple
        sports across four continents. Nine of twelve primary sleep outcomes favored
        supplementation, with significant effects for probiotics (combined <i>p</i>\u2009<\u20090.01)
        and synbiotics (<i>p</i>\u2009<\u20090.001). Benefits were most consistent
        for subjective sleep quality and, in some cases, sleep latency. Secondary
        outcomes showed occasional reductions in stress, anxiety, and fatigue.<h4>Conclusion</h4>Probiotic
        and synbiotic supplementation may improve sleep in exercised populations,
        especially perceived quality and latency. Evidence supports cautious, adjunctive
        use, but larger, standardized trials are needed to confirm effects.PROSPERO
        registration number: CRD420251151264.\",\"affiliation\":\"School of Medicine,
