        Med\"}},\"pubYear\":\"2026\",\"pageInfo\":\"2672193\",\"abstractText\":\"<h4>Introduction</h4>The
        clinical management of Alzheimer's disease (AD) is still constrained by the
        fact that its incompletely understood pathogenesis, difficulty in early diagnosis
        and the limited long-term treatment benefits so far. This article summarizes
        a regional perspective on the diagnosis and treatment of AD from the Alzheimer's
        Disease Chinese (ADC) guideline working group, aiming to improve the whole-process
        management of AD.<h4>Discussion</h4>The article presents a comprehensive overview
        of a proposed diagnostic and therapeutic paradigm for AD, consisting of a
        three-dimensional diagnostic framework and a sequential therapy concept. Crucially,
        while biological biomarkers of AD are present at all stages, they may be unrelated
        to clinical severity. To address this, the diagnostic framework combines core
        clinical criteria with early-changing biomarkers, syndrome staging and traditional
        Chinese medicine (TCM)-based pattern phenotyping. This integrated, simplified
        and practical approach enhances diagnostic certainty and its correlation with
        clinical severity. This sequential therapy is a stage-adaptive treatment plan
        adjusted according to the disease progression, utilizing a dynamic, multi-target
        combination therapy. Unlike the existing unchanging single-target therapies,
        this approach provides specific mechanistic interventions tailored to each
        stage to prolong efficacy and delay disease progression.<h4>Conclusions</h4>This
        paradigm provides a whole-process, stage-oriented approach to AD diagnosis
        and management that may improve translational relevance, clinical applicability
        and continuity of care in real-world settings. Future cohort-based validation
        studies are needed to confirm its diagnostic performance and clinical benefits,
        and to refine its implementation.\",\"affiliation\":\"Department of Neurology,
