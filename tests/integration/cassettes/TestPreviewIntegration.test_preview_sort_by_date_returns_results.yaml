        (Westport)\",\"essn\":\"1541-3764\",\"issn\":\"0030-2228\",\"isoabbreviation\":\"Omega
        (Westport)\",\"nlmid\":\"1272106\"}},\"pubYear\":\"2026\",\"pageInfo\":\"1233-1249\",\"abstractText\":\"<b>Background:</b>
        Research has predominantly focused on the post-traumatic consequences of grief.
        Less is known about the factors associated with the capacity for recovery
        and growth. <b>Objective:</b> The main goal of this study is to analyse the
        mediating role of coping strategies in the relationship between the impact
        of the event and posttraumatic growth, considering the degree of kinship and
        the cause of death. <b>Methods:</b> This exploratory and correlational study,
        which used a cross-sectional design, involved a community sample of 889 adults
        who had lost a loved one. <b>Results:</b> Emotion and problem-focused coping
        strategies mediate the relationship between the impact of loss and posttraumatic
        growth, specifically when a spouse or a child dies. <b>Conclusions:</b> Individuals
        who experience greater suffering also undergo higher levels of post-traumatic
        growth. Coping strategies are crucial in post-trauma reconstruction and growth.
        Furthermore, the degree of kinship and the cause of death are decisive factors.\",\"affiliation\":\"ISPA
        - Instituto Universit\xE1rio, Lisboa, Portugal.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
