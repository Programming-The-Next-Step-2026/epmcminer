        (Westport)\",\"isoabbreviation\":\"Omega (Westport)\",\"nlmid\":\"1272106\",\"issn\":\"0030-2228\",\"essn\":\"1541-3764\"}},\"pubYear\":\"2026\",\"pageInfo\":\"773-802\",\"abstractText\":\"This
        study addresses the experiences of informal caregivers caring for elderly
        family members with Alzheimer's disease (AD) during the COVID-19 pandemic.
        The study includes a sample of eight informal caregivers who were evaluated
        through a semi-structured interview six months after the death of a loved
        one they cared for. A thematic content analysis was applied to the interviews
        and yielded two higher-order domains: (1) Experiencing the AD and the death
        of a family member and (2) The grieving process during the COVID-19 pandemic.
        The results provide valuable insights into family caregivers' experiences
        regarding the profound emotional impact of caregiving and grief during the
        COVID-19 pandemic. Caregivers maintain their identity even after loss, underscoring
        the enduring impact of caregiving. The identity as a caregiver impacted coping
        and grief responses, highlighting the need for tailored interventions.\",\"affiliation\":\"Psychology
