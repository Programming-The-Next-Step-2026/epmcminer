        reports\",\"medlineAbbreviation\":\"Psychol Rep\",\"issn\":\"0033-2941\",\"essn\":\"1558-691X\",\"isoabbreviation\":\"Psychol
        Rep\",\"nlmid\":\"0376475\"}},\"pubYear\":\"2026\",\"pageInfo\":\"2061-2079\",\"abstractText\":\"<b>Objective</b>:
        This study was conducted to explore the sex differences in the direct and
        indirect associations among mental health/suicidality, sleep, and screen time.
        <b>Methods</b>: Using the 2021 Youth Risk Behavior Survey (YRBS) data, 9408
        participants were included in the analyses. The associations of endogenous
        variables (mental health and suicidality), exogenous variable (screen time),
        mediator (sleep), and covariates (demographic features and risky behaviors)
        were analyzed using the Structural Equation Model and \\\"medsem\\\" package,
        as well as logistic regression and bootstrapping methods. To explore the sex
        differences in the mediation effect, the Likelihood Ratio Test was used for
        the multiple-group analysis to compare the unconstrained model with the mediation
        path-constrained model. <b>Results</b>: Screen time had a significant negative
        association with sleep duration (female: \u03B2 = -.09, <i>p</i> < .001; male:
        \u03B2 = -.04, <i>p</i> < .001), positive relations to mental health problems
        (female: \u03B2 = .10, <i>p</i> < .001; male: \u03B2 = .12; <i>p</i> < .001),
        and suicidality (female: OR: 1.07, 95% CI: 1.02-1.13; male: OR: 1.06, 95%
        CI: 1.01-1.23). Sleep duration is negatively associated with mental health
        problems (female: \u03B2 = -.16, <i>p</i> < .001; male: \u03B2 = -.14; <i>p</i>
        < .001) and negatively associated with the likelihood of suicidality (female:
        .89, 95% CI: .85-.94; male: OR: .84, 95% CI: .79-.90). Furthermore, female
        adolescents had higher frequencies in mental health problems, higher odds
        ratio in suicidality, shorter sleep duration, and bigger mediation effects
        of sleep, compared to their male counterparts. <b>Conclusion</b>: Mental health
        and suicidality were affected differently by screen time and sleep between
        female and male adolescents. Future research may continue to explore sex differences
        and their underlying reasons.\",\"affiliation\":\"Department of Health Behavior,
        School of Public Health, Texas A&M University, College Station, Texas, USA.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
