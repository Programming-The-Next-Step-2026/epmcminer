        Cancer Surviv\",\"nlmid\":\"101307557\"}},\"pubYear\":\"2026\",\"pageInfo\":\"1131-1144\",\"abstractText\":\"<h4>Purpose</h4>To
        compare breast cancer survivors (BCS) to women without breast cancer (controls)
        on sleep health risk factors and actigraphy-derived dimensions of sleep (duration,
        maintenance, timing, and regularity) and examine whether the effect of breast
        cancer on sleep differs by time since diagnosis.<h4>Methods</h4>Analyses included
        data from 68 BCS and 1042 controls who participated in actigraphy and Pink
        SWAN sub-studies within the Study of Women's Health Across the Nation. BCS
        and control characteristics were compared using chi-square, Fisher's exact,
        and Wilcoxon rank sum tests. Sleep measures were regressed onto breast cancer
        status using binomial logistic and linear regression. The interaction between
        BCS status and years since diagnosis (<\u20095;\u2009\u2265\u20095) was tested
        in these models before and after covariate adjustment.<h4>Results</h4>There
        were no overall sleep differences between BCS and controls; both groups experienced
        poor sleep health on average across multiple dimensions. Physical inactivity,
        sleep apnea, and vasomotor and depressive symptoms were associated with worse
        sleep in both groups. Total sleep time was lower among BCS than controls within
        5\_years of diagnosis (6.13 vs. 6.57\_h; p\u2009=\u2009.03) but did not differ
        at\u2009>\u20095\_years post-diagnosis (6.59 vs. 6.45\_h; p\u2009=\u2009.32).
        BCS reported greater use of exogenous hormones (p\u2009<\u2009.0001) and were
        twice as likely to have initiated anxiolytic use post-diagnosis (p\u2009=\u2009.03).<h4>Conclusions</h4>BCS
        within 5\_years of diagnosis experienced shorter sleep duration than controls
        but did not differ on other sleep parameters. Both groups experienced poor
        sleep health.<h4>Implications for cancer survivors</h4>BCS and similarly-aged
        women experience poor sleep health requiring assessment and treatment.\",\"affiliation\":\"Department
