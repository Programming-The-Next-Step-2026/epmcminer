        Hum Dev\",\"essn\":\"1573-3327\",\"issn\":\"0009-398X\",\"isoabbreviation\":\"Child
        Psychiatry Hum Dev\",\"nlmid\":\"1275332\"}},\"pubYear\":\"2026\",\"pageInfo\":\"881-892\",\"abstractText\":\"Family
        accommodation (FA) is widely-recognised as an important clinical phenomenon
        in obsessive-compulsive disorder (OCD) and anxiety disorders, and is related
        to poorer treatment outcomes. However, FA has not been quantitatively explored
        in Body Dysmorphic Disorder (BDD). The aim of this study was to investigate
        the patterns and correlates of maternal accommodation in adolescent BDD, and
        its association with treatment outcomes. Participants were 131 adolescents
        with BDD and their mothers who completed the Family Accommodation Scale-Parent
        Report (FAS-PR) as part of routine clinical practice in a National and Specialist
        Service for Young People at the Maudsley Hospital, London. Seventy-six (58%)
        young people received specialist cognitive behavioural therapy for BDD and
        had post-treatment data available. All mothers engaged in at least one form
        of accommodation. Providing reassurance (98.5%) and assisting avoidance (88.5%)
        were the most commonly endorsed behaviours. Levels of accommodation were positively
        associated with clinician-rated BDD symptom severity (r\u2009=\u20090.18,
        p\u2009=\u20090.041) and maternal symptoms of anxiety, depression and stress
        (r\u2009=\u20090.41, p\u2009<\u20090.001), and negatively associated with
        child global functioning (r\u2009=\u2009-0.38, p\u2009<\u20090.001). Maternal
        accommodation did not predict treatment outcomes (\u03B2\u2009=\u20090.055,
        p\u2009>\u20090.05). The findings indicate that maternal accommodation is
        common and has important clinical correlates, but does not impact on treatment
        response. Consequently, the relationship between maternal accommodation and
        BDD symptoms may differ to that evidenced in paediatric OCD. Future longitudinal
        research exploring maternal and paternal accommodation, and assessing variables
        of interest at multiple time-points throughout treatment, is needed to advance
        understanding of the role of FA in adolescent BDD.\",\"affiliation\":\"Research
        Department of Clinical, Educational and Health Psychology, University College
