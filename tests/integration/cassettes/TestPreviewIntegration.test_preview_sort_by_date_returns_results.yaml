        of cancer survivorship : research and practice\",\"medlineAbbreviation\":\"J
        Cancer Surviv\",\"issn\":\"1932-2259\",\"essn\":\"1932-2267\",\"isoabbreviation\":\"J
        Cancer Surviv\",\"nlmid\":\"101307557\"}},\"pubYear\":\"2026\",\"pageInfo\":\"1010-1022\",\"abstractText\":\"<h4>Purpose</h4>To
        determine the efficacy of nurse-delivered brief behavioral treatment for insomnia
        (BBTI) compared to an attention control, in a heterogeneous sample of cancer
        survivors to reduce insomnia symptom severity.<h4>Methods</h4>We recruited
        132 participants from cancer care clinics, who had an Insomnia Severity Index
        (ISI) score\u2009\u2265\u20098. Participants were randomized into two groups:
        an experimental BBTI group and a healthy eating attention control group. Demographics
        survey at baseline, and sleep-related questionnaires, self-reported sleep
        diaries, and wrist-worn actigraphy at baseline, 1, 3, and 12\_months were
        collected. Statistical analyses used analysis of covariance (ANCOVA) models
        with two-sided 0.05 nominal significance level for treatment effect for primary
        outcome of insomnia severity at 1\_month.<h4>Results</h4>Participants were
        cancer survivors with a mean age of 63.7\_years, 55% female, 88.6% white,
        with breast, prostate, colorectal, and lung cancer. Statistically significant
        group differences were observed at all time points for ISI and sleep quality
        (ISI effect sizes 0.56, 0.59, and 0.54 respectively). Additionally, at 1\_month,
        those in insomnia remission (ISI\u2009\u2264\u20098) were higher for the BBTI
        (55.1%) compared to the control group (43.3%). Secondary outcomes from sleep
        diary measures (i.e., sleep efficiency, sleep onset latency, wake after sleep
        onset) were significant at 1\_month.<h4>Conclusion</h4>The BBTI group was
        significantly effective in reducing insomnia severity and improving sleep
        quality over time compared to the control among cancer survivors.<h4>Clinical
        trial registration</h4>Clinical trials identifier: http://ClinicalTrials.gov
        , NCT03810365.<h4>Implications for cancer survivors</h4>Implementing BBTI
        in survivorship settings can effectively address and manage insomnia symptoms,
        thus bridging a crucial gap in care for cancer survivors.\",\"affiliation\":\"University
