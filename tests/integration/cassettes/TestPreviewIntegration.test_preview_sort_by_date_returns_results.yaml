        of Special Education, Tel-Hai Academic College, 12208 Kiryat Shmona, Upper
        Galilee, Israel. yaffeyos@telhai.ac.il.\"}]}}]},\"journalInfo\":{\"issue\":\"3\",\"volume\":\"57\",\"journalIssueId\":4200989,\"dateOfPublication\":\"2026
        Jun\",\"monthOfPublication\":6,\"yearOfPublication\":2026,\"printPublicationDate\":\"2026-06-01\",\"journal\":{\"title\":\"Child
        psychiatry and human development\",\"medlineAbbreviation\":\"Child Psychiatry
        Hum Dev\",\"essn\":\"1573-3327\",\"issn\":\"0009-398X\",\"isoabbreviation\":\"Child
        Psychiatry Hum Dev\",\"nlmid\":\"1275332\"}},\"pubYear\":\"2026\",\"pageInfo\":\"927-940\",\"abstractText\":\"The
        study probes the role played by parenting control practices and parental locus
        of control in the relationship between parent and child anxiety. The study
        particularly aims at probing these matters in light of the parental gender-specific
        role, striving to improve our understanding of the differential etiological
        contribution of mothers' and fathers' anxiety and parental practices to child's
        anxiety. The study consisted of 316 parents (159 mothers and 157 fathers)
        who reported their own and their child's anxiety using valid instruments.
        The general path model used in the study exhibited an adequate fit to the
        data, generally confirming our theory regarding the direct and indirect associations
        between parent-child anxiety. Using SEM multiple group analysis for parental
        gender, a strong-direct unique association was found between parent and child
        anxiety. For mothers, this association was partially mediated by maternal
        overprotection. Finally, maternal external locus of control was positively
        associated with child anxiety, after accounting for the effects of all other
        maternal variables. The study's findings and limitations are profoundly discussed
        in light of parental gender differences.\",\"affiliation\":\"Department of
        Special Education, Tel-Hai Academic College, 12208 Kiryat Shmona, Upper Galilee,
        Israel. yaffeyos@telhai.ac.il.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
