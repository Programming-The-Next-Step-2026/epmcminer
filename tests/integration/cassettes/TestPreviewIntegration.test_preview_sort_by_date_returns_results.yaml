        (Westport)\",\"essn\":\"1541-3764\",\"issn\":\"0030-2228\",\"isoabbreviation\":\"Omega
        (Westport)\",\"nlmid\":\"1272106\"}},\"pubYear\":\"2026\",\"pageInfo\":\"1201-1221\",\"abstractText\":\"We
        investigated the effects of cause of death (COVID-19 with an underlying medical
        condition vs. without) and prolonged grief disorder status (PGD present or
        absent) on participants' reported public stigma towards the bereaved. Participants
        (<i>N =</i> 304, 66% women; <i>M</i><sub>age</sub> = 39.39 years) were randomly
        assigned to read one of four vignettes describing a bereaved man. Participants
        completed stigma measures assessing negative attributions, desired social
        distance, and emotional reactions. Participants reported significantly stronger
        stigmatizing responses towards an individual with PGD (vs. without PGD) across
        all stigma measures. There was no significant difference in stigma based on
        cause of death; however, stigma was reported regardless of cause of death.
        There was no significant interaction between cause of death and PGD on stigma.
        This study supports the robust finding of public stigma being reported toward
        an individual with PGD, suggesting these individuals are at risk of public
        stigma and not receiving adequate bereavement support.\",\"affiliation\":\"Curtin
        School of Population Health, Curtin University, Perth, Australia.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
