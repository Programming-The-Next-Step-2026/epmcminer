        of Human Sciences, The Ohio State University, Columbus, OH, USA.\"}]}}]},\"authorIdList\":{\"authorId\":[{\"type\":\"ORCID\",\"value\":\"0000-0002-9686-5441\"}]},\"journalInfo\":{\"issue\":\"3\",\"volume\":\"57\",\"journalIssueId\":4200989,\"dateOfPublication\":\"2026
        Jun\",\"monthOfPublication\":6,\"yearOfPublication\":2026,\"printPublicationDate\":\"2026-06-01\",\"journal\":{\"title\":\"Child
        psychiatry and human development\",\"medlineAbbreviation\":\"Child Psychiatry
        Hum Dev\",\"essn\":\"1573-3327\",\"issn\":\"0009-398X\",\"isoabbreviation\":\"Child
        Psychiatry Hum Dev\",\"nlmid\":\"1275332\"}},\"pubYear\":\"2026\",\"pageInfo\":\"869-880\",\"abstractText\":\"Parents,
        including fathers, contribute to the early development of internalizing symptoms,
        which is observable and prevalent among young children. This longitudinal
        study examined the moderating role of paternal depressive symptoms/emotion
        dysregulation in the prospective associations between maternal depressive
        symptoms/emotion dysregulation and children's internalizing problems (depressive
        and anxiety symptoms). Ninety-four preschoolers and their mothers and fathers
        participated. Parents completed online questionnaires when their children
        were four years old and one year later. Results indicated that higher paternal
        depressive symptoms were associated with an increase, while lower paternal
        symptoms were associated with a decrease, in the negative impact of maternal
        emotion dysregulation on children's later depressive, but not anxiety, symptoms.
        We also tested the moderating role of paternal emotion dysregulation, these
        pathways were not significant. The findings enhance our understanding of the
        interaction between maternal and paternal psychological characteristics in
        contributing to children's anxiety and depressive symptoms.\",\"affiliation\":\"Department
        of Human Sciences, The Ohio State University, Columbus, OH, USA. Gong.371@osu.edu.\",\"publicationStatus\":\"ppublish\",\"language\":\"eng\",\"pubModel\":\"Print-Electronic\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
