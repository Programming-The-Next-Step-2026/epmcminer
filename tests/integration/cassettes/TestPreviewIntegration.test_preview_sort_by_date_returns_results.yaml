        P.\",\"authorList\":{\"author\":[{\"fullName\":\"Feng S\",\"firstName\":\"Shuo\",\"lastName\":\"Feng\",\"initials\":\"S\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-3276-7586\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
