        M, Merriman J.\",\"authorList\":{\"author\":[{\"fullName\":\"Melnyk H\",\"firstName\":\"Halia\",\"lastName\":\"Melnyk\",\"initials\":\"H\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"New
