        Infant Psychol\",\"essn\":\"1469-672X\",\"issn\":\"0264-6838\",\"isoabbreviation\":\"J
        Reprod Infant Psychol\",\"nlmid\":\"8501885\"}},\"pubYear\":\"2026\",\"pageInfo\":\"803-817\",\"abstractText\":\"<h4>Background</h4>Parents
        cuddling their babies during intensive care to promote parent-infant bonding
        is usual practice in the neonatal intensive care unit (NICU). However, babies
        undergoing cooling therapy and intensive care are not routinely offered parent-infant
        cuddles due to concerns of impacting the cooling process or intensive care.
        We developed the CoolCuddle intervention to enable parents to cuddle babies
        safely during cooling therapy. We investigated whether CoolCuddle impacted
        parent-infant bonding and parent's mental health.<h4>Methods</h4>We conducted
        parental interviews and compared mental health and bonding measures in two
        cohorts of parents; one with access to CoolCuddle and the other where CoolCuddle
        was not available.<h4>Results</h4>Ten tertiary NICUs in England and Wales
        from 2019 to 2023 were involved and 107 families. There were high levels of
        post-delivery depression amongst all parents. However, at discharge mothers
        in the CoolCuddle group had significantly less depression, lower EPDS scores,
        and higher MIBS scores (consistent with better mother-infant bonding) than
        those where CoolCuddle was not available. All measures appeared similar when
        re-measured at 8\u2009weeks. Parents reported they were not ready to access
        psychological support or information whilst on NICU and stressed the need
        of mental health support following discharge, which was not offered or available.<h4>Conclusion</h4>The
        CoolCuddle intervention was associated with a lower prevalence of depression
        and enhanced bonding scores for mothers at discharge compared to those who
        did not cuddle their babies. Parents highlighted increased levels of postnatal
        depression following the sudden and traumatic admission of their infant to
