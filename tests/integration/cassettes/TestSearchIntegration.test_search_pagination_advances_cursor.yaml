        MM\",\"firstName\":\"Mohammad Mohsen\",\"lastName\":\"Bigham\",\"initials\":\"MM\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0009-0002-4906-3865\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"School
