        Res\",\"essn\":\"2057-4347\",\"issn\":\"2057-4347\",\"nlmid\":\"101692332\",\"isoabbreviation\":\"Clin
        Exp Dent Res\"}},\"pubYear\":\"2026\",\"pageInfo\":\"e70379\",\"abstractText\":\"<h4>Background
        and objectives</h4>Periodontitis is a chronic inflammatory disease affecting
        tooth-supporting structures, while depression is a common mental disorder
        with emotional and behavioral disturbances. Previous studies suggest a potential
        association between the two conditions. This study aimed to evaluate salivary
        concentrations of Receptor Activator of Nuclear Factor Kappa-B Ligand (RANKL)
        and Osteoprotegerin (OPG)-key regulators of osteoclast activity and periodontal
        bone resorption-in patients with periodontitis and depression.<h4>Materials
        and methods</h4>In this cross-sectional study, 80 patients from Shahid Beheshti
        University Dental School were categorized into four groups based on the presence
        or absence of periodontitis and depression. Periodontitis was defined as having
        \u2265\u20092 teeth in \u2265\u20092 quadrants with bleeding on probing, pocket
        depth >\u20093\u2009mm, and interdental clinical attachment loss \u2265\u20091\u2009mm.
        Depression was assessed using the Persian PHQ-9, and individuals meeting criteria
        for major depressive disorder(MDD) were classified as depressed. Unstimulated
        saliva samples (1\u2009mL) were collected, stored at -20\xB0C, and analyzed
        for OPG and RANKL using ELISA kits. Statistical analyses included two-way
        ANOVA (SPSS v27; p\u2009<\u20090.05 significant).<h4>Results</h4>Among 80
        participants (43 females, 37 males; mean age 45.3 years), RANKL, OPG, and
        the RANKL/OPG ratio were higher in depressed individuals, but differences
        were not statistically significant (p\u2009>\u20090.05). RANKL levels and
        the RANKL/OPG ratio were significantly higher in patients with periodontitis
        and increased with disease severity (p\u2009\u2264\u20090.05), while OPG showed
        no significant change.<h4>Conclusion</h4>Periodontitis and its severity significantly
        influence salivary RANKL and the RANKL/OPG ratio, while depression does not.
        Within the limits of this cross-sectional design, no evidence was found that
        RANKL and OPG act as intermediary biomarkers linking depression and periodontitis.\",\"affiliation\":\"Department
