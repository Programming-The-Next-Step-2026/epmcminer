        psychiatry\",\"medlineAbbreviation\":\"JAMA Psychiatry\",\"essn\":\"2168-6238\",\"issn\":\"2168-622X\",\"isoabbreviation\":\"JAMA
        Psychiatry\",\"nlmid\":\"101589550\"}},\"pubYear\":\"2026\",\"abstractText\":\"<h4>Importance</h4>Interleukin
        6 (IL-6), a keystone inflammatory cytokine, is a credible mechanistic candidate
        for causing depression. However, randomized clinical trials testing its treatment
        potential remain scarce.<h4>Objective</h4>To identify likely treatment-sensitive
        outcomes and effect size for systemic IL-6 inhibition in patients with difficult-to-treat
        depression.<h4>Design, setting, and participants</h4>This 4-week, proof-of-concept,
        double-blind, parallel-arm, placebo-controlled randomized clinical trial recruited
        adults with moderate-to-severe International Statistical Classification of
        Diseases and Related Health Problems, Tenth Revision (ICD-10) depression,
        poor antidepressant response, low-grade systemic inflammation (high-sensitivity
        C-reactive protein [hs-CRP] level \u22650.3 mg/dL on 2 tests), and depression
        somatic symptoms (Beck Depression Inventory II somatic symptoms score \u22657)
        from primary and secondary care and self-referral from 2018 to 2022. Participants
        were randomized into minimization balanced groups on depression severity and
        sex. Assessments were conducted at baseline and 7, 14, and 28 days after infusion.
        Data were analyzed from 2023 to 2025.<h4>Intervention</h4>Single intravenous
        infusion of IL-6R antagonist tocilizumab (8 mg/kg, maximum 800 mg/patient)
        or normal saline.<h4>Main outcomes and measures</h4>The primary outcome was
        depression somatic symptoms at 14 days after infusion. The secondary outcome
        was total depression severity. Exploratory outcomes included fatigue, anxiety,
        anhedonia, quality of life, and cognition. Outcomes were assessed using validated
        scales and interpreted against clinically meaningful thresholds.<h4>Results</h4>A
        total of 30 participants (mean [SD] age, 41.1 [12.3] years; 24 [80.0%] female)
        were randomized, including 14 in the tocilizumab group and 16 in the placebo
        group. Of these, 29 participants received the assigned infusion and completed
        follow-up. As expected for a small proof-of-concept study, no results reached
        statistical significance, including little improvement in depression somatic
        symptoms at day 14 (adjusted mean difference: -0.12; 95% CI, -2.51 to 2.28).
        However, a pattern of greater stepwise improvement over time was observed
        with tocilizumab in somatic symptoms, depression severity, fatigue, psychological
        symptoms, state anxiety, and quality of life, with the largest effects observed
        at the final follow-up (day 28). Tocilizumab may also improve more individual
        depressive symptoms. Treatment effects were within ranges considered clinically
        meaningful for depression severity, fatigue, anxiety, and quality of life.
        At the final follow-up, remission (7 participants [53.9%] vs 5 participants
        [31.3%]; number needed to treat [NNT]\u2009=\u20095) and response (6 participants
        [46.2%] vs 3 participants [18.8%]; NNT\u2009=\u20094) rates favored tocilizumab
        compared with placebo. Baseline hs-CRP level, but not IL-6 level, tracked
        depression improvement, suggesting hs-CRP may better predict immunotherapy
        response in depression than drug-specific biomarkers. Tocilizumab was well
        tolerated, with no serious adverse events or withdrawals.<h4>Conclusions and
        relevance</h4>These findings highlight treatment-sensitive outcomes, effect
        sizes, and patient selection methods for testing systemic IL-6 inhibition
        in patients with difficult-to-treat depression, and call for a large-scale
        efficacy trial of anti-IL-6 treatment in depression.<h4>Trial registration</h4>isrctn.org
