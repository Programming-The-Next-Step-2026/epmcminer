        MH, Tabassum M, Parvej MI.\",\"authorList\":{\"author\":[{\"fullName\":\"Naim
        MH\",\"firstName\":\"Mehedi Hasan\",\"lastName\":\"Naim\",\"initials\":\"MH\",\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
