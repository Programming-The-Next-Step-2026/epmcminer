        Metab\",\"essn\":\"2359-4292\",\"issn\":\"2359-3997\",\"isoabbreviation\":\"Arch
        Endocrinol Metab\",\"nlmid\":\"101652058\"}},\"pubYear\":\"2026\",\"abstractText\":\"<h4>Objective</h4>This
        study aimed to evaluate body composition, quality of life, and depression
        risk in women with polycystic ovary syndrome (PCOS) compared to women without
        PCOS.<h4>Subjects and methods</h4>This prospective, cross-sectional study
        assessed quality of life (QoL) and depressive symptoms in women with polycystic
        ovary syndrome (PCOS) compared with controls with and without overweight or
        obesity. Assessments included body composition, QoL, health-related quality
        of life (HRQoL), and depressive symptoms. Participants without PCOS were divided
        into two groups according to BMI: < 25 kg/m2 [median age 30 years (27-33)]
        and \u2265 25 kg/m2 [median age 32 years (29-35)].<h4>Results</h4>The study
        included 47 women with polycystic ovary syndrome (PCOS) phenotypes A and B.
        The median age was 29 years (25-35), and the median body mass index (BMI)
        was 32.08 kg/m2 (28.48-36.40). Women with PCOS showed a higher risk of depression
        (24% with moderate to severe risk) compared with women without PCOS, both
        with and without overweight or obesity (5% and 3%, respectively). Additionally,
        women with PCOS consistently reported lower QoL and HRQoL scores, particularly
        in the physical, environmental, and overall QoL domains, as well as in functional
        capacity, pain, general health status, vitality, emotional well-being, and
        mental health domains of HRQoL.<h4>Conclusion</h4>Based on these findings,
        we concluded that body composition does not appear to be a determining factor
        for increased risk of depressive symptoms or poorer perceptions of QoL and
        HRQoL in women with PCOS.\",\"affiliation\":\"Universidade Federal do Rio
        de Janeiro Rio de Janeiro RJ Brasil Programa de P\xF3s-gradua\xE7\xE3o em
