        Sci Rep\",\"nlmid\":\"101728855\"}},\"pubYear\":\"2026\",\"pageInfo\":\"e72531\",\"abstractText\":\"<h4>Background
        and aims</h4>Depression is now a worldwide public health issue among elderly,
        with particularly high prevalence among those residing in old-age homes. In
        Bangladesh, limited research has been conducted on this vulnerable population.
        This study aimed to determine the prevalence of depression and identify associated
        factors among elderly individuals living in old-age homes in Bangladesh.<h4>Methods</h4>A
        cross-sectional study was conducted from September 22 to November 15, 2025,
        among 158 elderly individuals (\u2009\u2265\u200960 years) residing in old-age
        homes in Gazipur, Chattogram, and Noakhali. Data on sociodemographic, lifestyle,
        social support, health, and institutional factors were collected, and depression
        was assessed using the short form of the Geriatric Depression Scale (GDS).
        Descriptive statistics summarized the data, while Chi-square tests and binary
        logistic regression were used to identify associations and predictors of geriatric
        depression.<h4>Results</h4>The study found that 82.3% of the elderly residents
        were experiencing depression and it increases with advancing age, particularly
        among those aged 70 years and above. Gender, type of illness, and satisfaction
        with services in old age homes were identified as significant predictors of
        depression among elderly residents. Females were considerably more likely
        to experience depression than males, and individuals with physical illnesses
        had higher odds of depression compared to those with mental health conditions.
        Moreover, participants reporting neutral satisfaction with old age home facilities
        were more prone to depression than those who were very satisfied.<h4>Conclusion</h4>The
        findings indicate a high prevalence of depression among elderly residents
        of old-age homes in Bangladesh, with several sociodemographic health-related
        and institutional factors contributing to its severity. These results highlight
        the need for targeted mental health interventions and improved care services,
        which may assist policymakers in developing effective strategies to address
        geriatric mental health issues in Bangladesh.\",\"affiliation\":\"Department
        of Statistics Noakhali Science and Technology University Noakhali Bangladesh.\",\"publicationStatus\":\"epublish\",\"language\":\"eng\",\"pubModel\":\"Electronic-eCollection\",\"pubTypeList\":{\"pubType\":[\"research-article\",\"Journal
