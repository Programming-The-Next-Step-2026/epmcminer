        MI\",\"firstName\":\"Md Iftakhar\",\"lastName\":\"Parvej\",\"initials\":\"MI\",\"authorId\":{\"type\":\"ORCID\",\"value\":\"0000-0002-4585-0792\"},\"authorAffiliationDetailsList\":{\"authorAffiliation\":[{\"affiliation\":\"Department
